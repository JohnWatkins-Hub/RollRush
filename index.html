<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Game</title>
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=SvmvS3peNLEAWJdjh0DD6Nq3O0lRNrLxXX5TOrWVilNuUeujb9ExpKZS7OZl_qIPr1A4_upFhF1v9RkWbyjttdPrXVEjcifNxedNWbktKvr1l0d3iq6ORGapmhMVR_4m0eGd-ty22R8D1hKBCosUXTetQlj_bSBAtQoJvT4U9xWJipu3VmviycYs7So-PR6_A8mEjfaZGLntoj16W03EaGKLvhG9VgveZJsVIH_u5sMINLoTZpl0vnTnvjmTHHMKA4pfhvKb5QdvRTC1Vi2Z3X_rReSiyvlsSNuzWXtypL-egmH1e8ZD4sY3PlTbTh44" charset="UTF-8"></script><style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #5b5bea, #8b5cf6, #ec4899);
    }

    .game {
        width: 380px;
        max-width: 90%;
        padding: 35px;
        text-align: center;
        background: white;
        border-radius: 24px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
        margin-top: 0;
        color: #25234a;
    }

    .subtitle {
        color: #777;
        margin-bottom: 25px;
    }

    .dice {
        width: 150px;
        height: 150px;
        margin: 0 auto 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 80px;
        background: #f3f4ff;
        border: 4px solid #6366f1;
        border-radius: 25px;
    }

    .scores {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 20px 0;
    }

    .score-box {
        flex: 1;
        padding: 12px;
        border-radius: 12px;
        font-weight: bold;
    }

    .current-score {
        background: #e0e7ff;
        color: #3730a3;
    }

    .high-score {
        background: #fef3c7;
        color: #92400e;
    }

    .score-number {
        display: block;
        font-size: 24px;
        margin-top: 5px;
    }

    button {
        width: 100%;
        padding: 13px;
        margin: 7px 0;
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.15s, opacity 0.15s;
    }

    button:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    .roll { background: #4f46e5; }
    .reset { background: #ef4444; }
    .quit { background: #374151; }

    .message {
        min-height: 24px;
        margin-top: 15px;
        color: #555;
        font-weight: bold;
    }
</style>
</head>

<body>
<div class="game">
    <h1>🎲 Dice Game</h1>
    <div class="subtitle">Roll the dice and build your score!</div>

    <div class="dice" id="dice">🎲</div>

    <div class="scores">
        <div class="score-box current-score">
            Score
            <span class="score-number" id="score">0</span>
        </div>

        <div class="score-box high-score">
            High Score
            <span class="score-number" id="highScore">0</span>
        </div>
    </div>

    <button class="roll" onclick="rollDice()">ROLL 🎲</button>
    <button class="reset" onclick="resetGame()">RESET</button>
    <button class="quit" onclick="quitGame()">QUIT</button>

    <div class="message" id="message"></div>
</div>

<script>
    let score = 0;

    // Load the saved high score, or start at 0
    let highScore = Number(localStorage.getItem("diceHighScore")) || 0;

    document.getElementById("highScore").textContent = highScore;

    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDice() {
        const number = Math.floor(Math.random() * 6) + 1;

        document.getElementById("dice").textContent =
            diceFaces[number - 1];

        score += number;

        document.getElementById("score").textContent = score;

        if (score > highScore) {
            highScore = score;

            document.getElementById("highScore").textContent =
                highScore;

            // Save high score permanently in the browser
            localStorage.setItem("diceHighScore", highScore);

            document.getElementById("message").textContent =
                "🔥 NEW HIGH SCORE!";
        } else {
            document.getElementById("message").textContent =
                "You rolled a " + number + "!";
        }
    }

    function resetGame() {
        score = 0;

        document.getElementById("dice").textContent = "🎲";
        document.getElementById("score").textContent = "0";
        document.getElementById("message").textContent = "Game reset!";
    }

    function quitGame() {
        document.getElementById("message").textContent =
            "Thanks for playing! 👋";
    }
</script>
</body>
</html>
